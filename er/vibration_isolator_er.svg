ARCHAR(50)</text><rect x="420" y="140" width="320" height="276" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="420" y="140" width="320" height="34" fill="#E8EEF7" stroke="#222" stroke-width="1.6"/><text x="580.0" y="163" text-anchor="middle" font-weight="700" font-size="16">vibration_isolators</text><text x="430" y="196" font-size="12" font-weight="700" fill="#555">PK</text><text x="464" y="196" font-size="14" >id</text><text x="730" y="196" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="430" y="222" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="222" font-size="14" >title</text><text x="730" y="222" font-size="12" text-anchor="end" fill="#333">VARCHAR(100)</text><text x="430" y="248" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="248" font-size="14" >type</text><text x="730" y="248" font-size="12" text-anchor="end" fill="#333">VARCHAR(50)</text><text x="430" y="274" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="274" font-size="14" >stiffness</text><text x="730" y="274" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="430" y="300" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="300" font-size="14" >freq</text><text x="730" y="300" font-size="12" text-anchor="end" fill="#333">FLOAT</text><text x="430" y="326" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="326" font-size="14" font-style="italic" fill="#666">description</text><text x="730" y="326" font-size="12" text-anchor="end" fill="#333">VARCHAR(500) NULL</text><text x="430" y="352" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="352" font-size="14" font-style="italic" fill="#666">image_url</text><text x="730" y="352" font-size="12" text-anchor="end" fill="#333">VARCHAR(255) NULL</text><text x="430" y="378" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="378" font-size="14" font-style="italic" fill="#666">video_url</text><text x="730" y="378" font-size="12" text-anchor="end" fill="#333">VARCHAR(255) NULL</text><text x="430" y="404" font-size="12" font-weight="700" fill="#555"></text><text x="464" y="404" font-size="14" >is_deleted</text><text x="730" y="404" font-size="12" text-anchor="end" fill="#333">BOOLEAN</text><rect x="220" y="560" width="330" height="120" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="220" y="560" width="330" height="34" fill="#E8EEF7" stroke="#222" stroke-width="1.6"/><text x="385.0" y="583" text-anchor="middle" font-weight="700" font-size="16">likes</text><text x="230" y="616" font-size="12" font-weight="700" fill="#555">PK</text><text x="264" y="616" font-size="14" >id</text><text x="540" y="616" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="230" y="642" font-size="12" font-weight="700" fill="#555">FK</text><text x="264" y="642" font-size="14" >user_id</text><text x="540" y="642" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="230" y="668" font-size="12" font-weight="700" fill="#555">FK</text><text x="264" y="668" font-size="14" >vibration_isolator_id</text><text x="540" y="668" font-size="12" text-anchor="end" fill="#333">INTEGER</text><g font-size="12" fill="#333"><text x="50" y="860" font-weight="700" font-size="13">Обозначения</text>
<text x="50" y="884">PK — первичный ключ, FK — внешний ключ, UQ — уникальное значение</text>
<text x="50" y="904"><tspan font-style="italic" fill="#666">курсив + NULL</tspan> — необязательное поле (можно не заполнять при добавлении)</text>
<text x="50" y="924">Остальные поля — NOT NULL (обязательные)</text>
<text x="50" y="944">is_deleted — флаг мягкого удаления (по умолчанию false)</text>
<text x="50" y="964">likes — связь «многие-ко-многим» между users и vibration_isolators</text></g></svg>