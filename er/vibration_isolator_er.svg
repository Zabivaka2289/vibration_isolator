chor="end" fill="#333">VARCHAR(255) NULL</text><text x="450" y="378" font-size="12" font-weight="700" fill="#555"></text><text x="484" y="378" font-size="14" font-style="italic" fill="#666">video_url</text><text x="750" y="378" font-size="12" text-anchor="end" fill="#333">VARCHAR(255) NULL</text><text x="450" y="404" font-size="12" font-weight="700" fill="#555"></text><text x="484" y="404" font-size="14" >is_deleted</text><text x="750" y="404" font-size="12" text-anchor="end" fill="#333">BOOLEAN</text><rect x="230" y="470" width="330" height="120" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="230" y="470" width="330" height="34" fill="#E8EEF7" stroke="#222" stroke-width="1.6"/><text x="395.0" y="493" text-anchor="middle" font-weight="700" font-size="16">likes</text><text x="240" y="526" font-size="12" font-weight="700" fill="#555">PK</text><text x="274" y="526" font-size="14" >id</text><text x="550" y="526" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="240" y="552" font-size="12" font-weight="700" fill="#555">FK</text><text x="274" y="552" font-size="14" >user_id</text><text x="550" y="552" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="240" y="578" font-size="12" font-weight="700" fill="#555">FK</text><text x="274" y="578" font-size="14" >vibration_isolator_id</text><text x="550" y="578" font-size="12" text-anchor="end" fill="#333">INTEGER</text><rect x="230" y="660" width="330" height="198" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="230" y="660" width="330" height="34" fill="#E8EEF7" stroke="#222" stroke-width="1.6"/><text x="395.0" y="683" text-anchor="middle" font-weight="700" font-size="16">vibration_isolator_requests</text><text x="240" y="716" font-size="12" font-weight="700" fill="#555">PK</text><text x="274" y="716" font-size="14" >id</text><text x="550" y="716" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="240" y="742" font-size="12" font-weight="700" fill="#555"></text><text x="274" y="742" font-size="14" >title</text><text x="550" y="742" font-size="12" text-anchor="end" fill="#333">VARCHAR(200)</text><text x="240" y="768" font-size="12" font-weight="700" fill="#555"></text><text x="274" y="768" font-size="14" font-style="italic" fill="#666">description</text><text x="550" y="768" font-size="12" text-anchor="end" fill="#333">VARCHAR(1000) NULL</text><text x="240" y="794" font-size="12" font-weight="700" fill="#555"></text><text x="274" y="794" font-size="14" >status</text><text x="550" y="794" font-size="12" text-anchor="end" fill="#333">VARCHAR(20)</text><text x="240" y="820" font-size="12" font-weight="700" fill="#555">FK</text><text x="274" y="820" font-size="14" >author_id</text><text x="550" y="820" font-size="12" text-anchor="end" fill="#333">INTEGER</text><text x="240" y="846" font-size="12" font-weight="700" fill="#555">FK</text><text x="274" y="846" font-size="14" font-style="italic" fill="#666">vibration_isolator_id</text><text x="550" y="846" font-size="12" text-anchor="end" fill="#333">INTEGER NULL</text><g font-size="12" fill="#333" ><text x="40" y="900" font-weight="700" font-size="13">Обозначения</text>
<text x="40" y="922">PK — первичный ключ, FK — внешний ключ, UQ — уникальное значение</text>
<text x="40" y="940"><tspan font-style="italic" fill="#666">курсив + NULL</tspan> — необязательное поле (можно не заполнять при добавлении)</text>
<text x="40" y="958">Остальные поля — NOT NULL (обязательные)</text>
<text x="40" y="976">is_deleted — флаг мягкого удаления (по умолчанию false)</text>
<text x="40" y="994">likes — связь «многие-ко-многим» между users и vibration_isolators</text>
<text x="40" y="1012">vibration_isolator_requests — заявки пользователей; author_id ставится из сессии; role: user / moderator</text></g></svg>