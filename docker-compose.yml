# Запуск: docker-compose up -d
# Поднимает 2 контейнера:
#   vibration_isolator_postgres - СУБД PostgreSQL (порт 55432 на компьютере → 5432 в контейнере)
#   vibration_isolator_adminer  - веб-интерфейс к БД (http://localhost:8081)
#   vibration_isolator_redis    - Redis для хранения сессий (порт 56379), ЛР-4
services:
  postgres:
    image: postgres:15-alpine
    container_name: vibration_isolator_postgres
    environment:
      POSTGRES_USER: vibration_isolator_user
      POSTGRES_PASSWORD: vibration_isolator_password
      POSTGRES_DB: vibration_isolator_db
    ports:
      - "55432:5432"
    volumes:
      # Данные БД хранятся в томе, чтобы не пропадали при перезапуске контейнера
      - vibration_isolator_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: vibration_isolator_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: vibration_isolator_redis
    ports:
      - "56379:6379"

volumes:
  vibration_isolator_pgdata:
