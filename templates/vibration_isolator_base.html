<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Фиксированная ширина под один телефон (390×844, iPhone 12/13/14).
         Адаптивности нет: страница НЕ растягивается на весь экран. -->
    <meta name="viewport" content="width=390">
    <title>{% block title %}Виброизоляция{% endblock %}</title>
    <!-- Один и тот же файл стилей на ВСЕХ страницах (раньше были разные ?v=, из-за чего
         на «Добавить» подтягивалась старая версия CSS из кэша) -->
    <link rel="stylesheet" href="/static/css/vibration_isolator_style.css?v=21">
</head>
<body>
    <!-- .phone — «экран телефона» фиксированного размера, всё содержимое внутри него -->
    <div class="phone {% block phone_class %}{% endblock %}">
        {% block content %}{% endblock %}

        <!-- Нижняя навигация. Иконки — SVG (а не эмодзи), поэтому видны и у активной,
             и у неактивной кнопки на любой странице -->
        {% set active = nav_active | default('') %}
        <nav class="bottom-nav">
            <a href="/feed" class="nav-item {% if active == 'feed' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
                <span class="nav-label">Лента</span>
            </a>
            <a href="/add" class="nav-item {% if active == 'add' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span class="nav-label">Добавить</span>
            </a>
            <a href="/" class="nav-item {% if active == 'grid' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
                <span class="nav-label">Плитка</span>
            </a>
            <!-- ЛР-4: профиль (без входа откроется страница логина) -->
            <a href="/profile" class="nav-item {% if active == 'profile' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <span class="nav-label">Профиль</span>
            </a>
        </nav>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
